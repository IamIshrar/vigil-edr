<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 4 7v8c0 7.5 5.1 13.6 12 15 6.9-1.4 12-7.5 12-15V7L16 2Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="16" cy="15" r="4" fill="currentColor"/></svg>
      <div><b>Vigil</b><span>EDR</span></div>
    </div>
    <nav id="nav">
      <a href="#overview" data-view="overview">Overview</a>
      <a href="#alerts" data-view="alerts">Alerts <span class="count" id="nav-alerts"></span></a>
      <a href="#processes" data-view="processes">Process tree</a>
      <a href="#timeline" data-view="timeline">Timeline</a>
      <a href="#network" data-view="network">Network</a>
      <a href="#persistence" data-view="persistence">Persistence</a>
      <a href="#rules" data-view="rules">Detection rules</a>
      <a href="#response" data-view="response">Response</a>
      <a href="#how" data-view="how">How it works</a>
    </nav>
    <div class="sidebar-foot" id="host-foot"></div>
  </aside>

  <main>
    <header class="topbar">
      <h1 id="view-title">Overview</h1>
      <div class="topbar-right">
        <span class="live"><i></i>Live</span>
        <span id="admin-badge" class="badge"></span>
      </div>
    </header>
    <section id="view" class="view" aria-live="polite"></section>
  </main>
</div>

<div id="drawer" class="drawer" hidden>
  <div class="drawer-backdrop" data-close></div>
  <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <button class="icon-btn drawer-close" data-close aria-label="Close">&times;</button>
    <div id="drawer-body"></div>
  </div>
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-card" role="alertdialog" aria-modal="true" aria-labelledby="modal-title">
    <h3 id="modal-title"></h3>
    <p id="modal-text"></p>
    <div class="modal-actions">
      <button class="btn" id="modal-cancel">Cancel</button>
      <button class="btn danger" id="modal-ok">Confirm</button>
    </div>
  </div>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
